<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Filter</title>
  <style>
    body {
      width: 260px;
      padding: 12px;
      font-family: Arial, sans-serif;
    }

    input, select, button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      box-sizing: border-box;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: green;
    }
  </style>
</head>
<body>

  <h3>Content Filter</h3>

  <label for="keyword">Keywords</label>
  <input id="keyword" type="text" placeholder="music, gaming, ai">

  <label for="mode">Filtering mode</label>
  <select id="mode">
    <option value="whitelist">Whitelist</option>
    <option value="blacklist">Blacklist</option>
  </select>
  <label for="enabled">Filtering</label>
  <select id="enabled">
    <option value="true">Enabled</option>
    <option value="false">Disabled</option>
  </select>
  <button id="save" type="button">Save settings</button>

  <div id="support-status" role="status" aria-live="polite"></div>
  <div id="status" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>

</body>
</html>
